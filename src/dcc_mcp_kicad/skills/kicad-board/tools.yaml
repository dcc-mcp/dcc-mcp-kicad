                    - uuid
                    - width_mm
                    - net
                  maxItems: 1000
                footprints:
                  type: array
                  items: *id020
                  maxItems: 1000
                truncated: &id021
                  type: boolean
                path:
                  type:
                  - string
                  - 'null'
                dirty: *id021
                revision: *id022
              additionalProperties: false
              required:
              - counts
              - tracks
              - footprints
              - truncated
              - path
              - dirty
              - revision
            reopened: *id021
          additionalProperties: false
          required: []
        postcondition: *id011
        _meta:
          type: object
      additionalProperties: false
      required:
      - success
      - message
      - error
      - prompt
      - context
      allOf:
      - if:
          properties:
            success:
              const: true
        then:
          properties:
