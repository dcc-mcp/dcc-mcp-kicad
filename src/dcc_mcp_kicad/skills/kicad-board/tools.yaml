tools:
- name: status
  description: Inspect native host version, runtime mode, workspace, lane identity and board state.
  source_file: scripts/status.py
  input_schema:
    type: object
    properties: {}
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success: &id005
        type: boolean
      message: &id006
        type: string
      error: &id001
        type:
        - string
        - 'null'
      prompt: *id001
      context:
        type: object
        properties:
          host_version: &id002
            type: string
          runtime: *id002
          workspace: *id002
          board_loaded: &id003
            type: boolean
          dirty: *id003
          cli_available: *id003
          cli_version:
            type:
            - string
            - 'null'
          cli_compatible: *id003
          python_version: *id002
          revision:
            type: integer
            minimum: 0
            description: Current in-memory board revision; echo as expected_revision to reject stale work
          host_thread_id: &id004
            type: integer
            minimum: 0
          process_id: *id004
          live_editor_connection: *id003
        additionalProperties: false
        required: []
      postcondition: &id011
        type: object
        properties:
          verified: *id005
          method: *id006
          operation: *id006
        additionalProperties: false
        required:
        - verified
      _meta:
        type: object
    additionalProperties: false
    required:
    - success
    - message
    - error
    - prompt
    - context
    allOf:
    - if:
        properties:
          success:
            const: true
      then:
        properties:
          context:
            type: object
            properties:
              host_version: *id006
              runtime: *id006
              workspace: *id006
              board_loaded: *id005
              dirty: *id005
              cli_available: *id005
              cli_version: *id001
              cli_compatible: *id005
              python_version: *id006
              revision: &id012
                type: integer
                minimum: 0
                description: Current in-memory board revision; echo as expected_revision to reject stale work
              host_thread_id: &id007
                type: integer
                minimum: 0
              process_id: *id007
              live_editor_connection: *id005
            additionalProperties: false
            required:
            - host_version
            - runtime
            - workspace
            - board_loaded
            - dirty
            - cli_available
            - cli_version
            - cli_compatible
            - python_version
            - revision
            - host_thread_id
            - process_id
            - live_editor_connection
          error:
            type: 'null'
      else:
        properties:
          error: *id006
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  requires_in_process: true
  timeout_hint_secs: 30
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
    deferred_hint: false
- name: create_board
  description: Create a synthetic rectangular two-test-point board with one connecting track.
  source_file: scripts/create_board.py
  input_schema:
    type: object
    properties:
      width_mm:
        type: number
        minimum: 20
        maximum: 200
        default: 60
      height_mm:
        type: number
        minimum: 20
        maximum: 200
        default: 40
      track_width_mm:
        type: number
        minimum: 0.1
        maximum: 3
        default: 0.8
      discard_unsaved:
        type: boolean
        default: false
      expected_revision:
        type: integer
        minimum: 0
        description: Current in-memory board revision; echo as expected_revision to reject stale work
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success: *id005
      message: *id006
      error: *id001
      prompt: *id001
      context:
        type: object
        properties:
          counts:
            type: object
            properties:
              footprints: &id008
                type: integer
                minimum: 0
              tracks: *id008
              drawings: *id008
            additionalProperties: false
            required:
            - footprints
            - tracks
            - drawings
          tracks:
            type: array
            items:
              type: object
              properties:
                uuid: &id009
                  type: string
                width_mm:
                  type: number
                net: *id009
              additionalProperties: false
              required:
              - uuid
              - width_mm
              - net
            maxItems: 1000
          footprints:
            type: array
            items: *id009
            maxItems: 1000
          truncated: &id010
            type: boolean
          path:
            type:
            - string
            - 'null'
          dirty: *id010
          revision:
            type: integer
            minimum: 0
            description: Current in-memory board revision; echo as expected_revision to reject stale work
        additionalProperties: false
        required: []
      postcondition: *id011
      _meta:
        type: object
    additionalProperties: false
    required:
    - success
    - message
    - error
    - prompt
    - context
    allOf:
    - if:
        properties:
          success:
            const: true
      then:
        properties:
          context: &id016
            type: object
            properties:
              counts: &id036
                type: object
                properties:
                  footprints: *id007
                  tracks: *id007
                  drawings: *id007
                additionalProperties: false
                required:
                - footprints
                - tracks
                - drawings
              tracks: &id037
                type: array
                items:
                  type: object
                  properties:
                    uuid: *id006
                    width_mm: &id018
                      type: number
                    net: *id006
                  additionalProperties: false
                  required:
                  - uuid
                  - width_mm
                  - net
                maxItems: 1000
              footprints: &id038
                type: array
                items: *id006
                maxItems: 1000
              truncated: *id005
              path: *id001
              dirty: *id005
              revision: *id012
            additionalProperties: false
            required:
            - counts
            - tracks
            - footprints
            - truncated
            - path
            - dirty
            - revision
          error:
            type: 'null'
      else:
        properties:
          error: *id006
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  requires_in_process: true
  timeout_hint_secs: 30
  annotations: &id039
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: false
  next-tools: &id040
    on-failure:
    - status
    - inspect_board
