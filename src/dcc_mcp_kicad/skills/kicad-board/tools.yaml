              required:
              - path
              - bytes
              - sha256
              - revision
              - board
              - reopened
            error:
              type: 'null'
        else:
          properties:
            error: *id006
    - &id027
      type: object
      properties:
        job_id: *id006
        core_job_id: *id006
        job_id_owner:
