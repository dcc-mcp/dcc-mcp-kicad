- name: set_track_width
  description: Set one straight track width and verify native readback.
  source_file: scripts/set_track_width.py
  input_schema:
    type: object
    properties:
      track_uuid:
        type: string
        minLength: 36
        description: UUID from inspect_board
        maxLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      width_mm:
        type: number
        minimum: 0.1
        maximum: 3
        default: 1.2
      expected_revision:
        type: integer
        minimum: 0
        description: Current in-memory board revision; echo as expected_revision to reject stale work
    additionalProperties: false
    required:
    - track_uuid
    - width_mm
  output_schema:
    type: object
    properties:
      success: *id005
      message: *id006
      error: *id001
      prompt: *id001
      context:
        type: object
        properties:
          track_uuid:
            type: string
          previous_width_mm: &id017
            type: number
          width_mm: *id017
          dirty:
            type: boolean
          revision:
            type: integer
            minimum: 0
            description: Current in-memory board revision; echo as expected_revision to reject stale work
        additionalProperties: false
        required: []
      postcondition: *id011
      _meta:
        type: object
    additionalProperties: false
    required:
    - success
    - message
    - error
    - prompt
    - context
    allOf:
    - if:
        properties:
          success:
            const: true
      then:
        properties:
          context:
            type: object
            properties:
              track_uuid: *id006
              previous_width_mm: *id018
              width_mm: *id018
              dirty: *id005
              revision: *id012
            additionalProperties: false
            required:
            - track_uuid
            - previous_width_mm
            - width_mm
            - dirty
            - revision
          error:
            type: 'null'
      else:
        properties:
          error: *id006
